1/1;display:grid;place-items:center;overflow:hidden;border:1px solid #ffffff2b;border-radius:7px;background:radial-gradient(circle at 35% 22%,#655479,#2b2344 72%);box-shadow:inset 0 2px 8px #0007}.cell img{display:block;width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 3px 3px #0008);pointer-events:none}.cell.win{z-index:1;border-color:#fff5a3;box-shadow:0 0 16px #ffda6c,inset 0 0 12px #ffda6c;animation:glow .45s alternate infinite}.cell.clear{animation:vanish .25s ease-in forwards}.cell.fall img{animation:drop .3s cubic-bezier(.2,1.4,.4,1) both}.cell.spin img{animation:blur .11s linear infinite}.cell:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent,#ffffff12,transparent)}.board.pharaoh{grid-template-columns:repeat(5,minmax(0,1fr));max-width:520px}.board.neon{grid-template-columns:repeat(6,minmax(0,1fr))}.board.dragon{grid-template-columns:repeat(7,minmax(0,1fr))}.board.dragon .cell{border-radius:11px}.result{min-height:47px;color:#ffe3a0;font-size:clamp(16px,3.5vw,21px);font-weight:900;text-shadow:0 0 12px #000}.controls{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.small{border:1px solid #8d76a3;border-radius:11px;background:#342847;padding:10px 13px}.spinbtn{border:0;border-radius:15px;background:linear-gradient(#ffe7a1,#d99530);color:#28152a;padding:15px 32px;font-size:21px;font-weight:1000;box-shadow:0 5px 0 #855019,0 0 20px #efb75c55}.spinbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #855019}.foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:17px}.panel{margin-top:14px;padding:15px;border:1px solid #5a416b;border-radius:15px;background:#171126}.panel p{line-height:1.5}ol{padding-left:22px}li{margin:4px 0}.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;font-size:22px;animation:spark .9s ease-out forwards}.bonusOverlay{position:absolute;inset:0;z-index:10;background:#100921eb;display:flex;align-items:center;justify-content:center;padding:15px}.bonusBox{border:2px solid #e8b967;border-radius:22px;padding:25px;background:radial-gradient(circle at top,#60416a,#1d1530);max-width:380px;width:100%;box-shadow:0 0 65px #edb35d55}.bonusBox h3{font-size:27px;color:#ffe0a1}.bonusBox button{margin:8px;padding:13px 20px;border:1px solid #f7d180;background:#624177;border-radius:12px;font-weight:800}.hidden{display:none}footer{text-align:center;font-size:12px;color:#a497b6;padding:18px}@keyframes glow{to{filter:brightness(1.6);transform:scale(1.05)}}@keyframes vanish{to{transform:scale(.1) rotate(25deg);opacity:0}}@keyframes drop{from{transform:translateY(-140%);opacity:.1}to{transform:translateY(0);opacity:1}}@keyframes blur{to{filter:blur(4px);transform:translateY(8px)}}@keyframes spark{to{transform:translate(var(--dx),-130px) rotate(250deg);opacity:0}}@media(max-width:600px){header{padding:12px}.wallet{font-size:13px}.board{gap:2px;padding:4px}.cell{border-radius:4px}.stage{padding:11px}.spinbtn{width:100%}.board.dragon{gap:2px}.bonusBox{padding:15px}}@media(prefers-reduced-motion:reduce){.cell,.cell img,.spark{animation-duration:.01ms!important}}
</style><link rel="stylesheet" href="assets/arcana-v5.css?v=1"><link rel="stylesheet" href="assets/arcana-v5-fx.css?v=1"><script defer src="assets/arcana-v5-fx.js?v=1"></script><link rel="stylesheet" href="assets/arcana-v5-reels.css?v=1"><script defer src="assets/arcana-v5-reels.js?v=1"></script></head><body data-game="pharaoh"><header><h1>✦ ARCANA <small style="font-size:11px">V4</small></h1><div class="wallet">🪙 <span id="balance">5.000</span></div></header><main><nav class="tabs"><button class="tab active" data-game="pharaoh">𓂀 PHARAOH · 5×3</button><button class="tab" data-game="neon">⚡ NEON · 6×5</button><button class="tab" data-game="dragon">🐉 DRAGON · 7×7</button></nav><section class="stage" id="stage"><h2 id="title"></h2><p class="desc muted" id="desc"></p><div class="board" id="board"></div><div class="particles" id="particles"></div><div class="result" id="result" aria-live="polite">Elegí tu apuesta y girá</div><div class="controls"><button class="small" id="minus">−</button><strong>Apuesta: <span id="bet">50</span></strong><button class="small" id="plus">+</button><button class="spinbtn" id="spin">⟳ GIRAR</button></div><div class="foot"><span id="bonus" class="muted"></span><button class="small" id="sound">🔊 Sonido</button><button class="small" id="reset">Reiniciar créditos</button></div><div id="bonusOverlay" class="bonusOverlay hidden"><div class="bonusBox"><h3 id="bonusTitle"></h3><p id="bonusDesc"></p><div id="bonusChoices"></div></div></div></section><section class="panel"><strong id="rulesTitle">Reglas</strong><p id="rules" class="muted"></p><strong>Últimas partidas</strong><ol id="history"></ol></section></main><footer>Juego arcade con créditos ficticios. Sin depósitos, retiros ni premios de valor monetario.</footer><script>
'use strict';
const G={pharaoh:{title:"PHARAOH'S GOLD",desc:"Rodillos mecánicos · 5 columnas y 3 filas",w:5,h:3,syms:["crown","scarab","ruby","ankh","eye","urn"],bonus:"scarab"},neon:{title:"NEON FORTUNE 777",desc:"Cascadas · 6 columnas y 5 filas",w:6,h:5,syms:["seven","cherry","diamond","bell","star","bolt"],bonus:"bolt"},dragon:{title:"DRAGON'S TREASURE",desc:"Grupos conectados · 7 columnas y 7 filas",w:7,h:7,syms:["emerald","ruby","sapphire","gold","fire","egg"],bonus:"egg"}};
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString("es-AR"),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const colors={crown:["#ffe58e","#a45d15"],scarab:["#67e2ee","#1666a4"],ruby:["#ff6885","#a20d4c"],ankh:["#ffdc75","#8e4d21"],eye:["#92dfff","#1a689c"],urn:["#f6c18c","#8b4b2b"],seven:["#ff83cb","#b31470"],cherry:["#ff7b88","#b31e3d"],diamond:["#6dfaff","#1378d0"],bell:["#ffe37e","#b47b0c"],star:["#f8b0ff","#a22ac4"],bolt:["#96f6ff","#215cc9"],emerald:["#a6ffc4","#14834d"],sapphire:["#91bdff","#164bb4"],gold:["#ffdf83","#af6a13"],fire:["#ffae77","#ca3022"],egg:["#d8b2ff","#6840a8"]};
const paths={crown:"M23 52 L13 20 L29 32 L40 12 L51 32 L67 20 L57 52Z M22 57H58V65H22Z",scarab:"M40 17 C20 17 17 38 24 52 Q40 75 56 52 C63 38 60 17 40 17Z M40 20V63 M21 32L8 25 M20 46L7 51 M59 32L72 25 M60 46L73 51",ruby:"M21 17H59L72 35L40 70L8 35Z M8 35H72 M21 17L30 35L40 70L50 35L59 17",ankh:"M40 12 C18 12 22 42 40 42 C58 42 62 12 40 12Z M40 42V70 M20 51H60",eye:"M9 40 Q40 5 71 40 Q40 75 9 40Z M40 28A12 12 0 1 0 40 52A12 12 0 1 0 40 28",urn:"M20 17H60L54 25L58 55Q40 73 22 55L26 25Z M18 17H62 M28 31H52",seven:"M14 18H65V30L36 68H21L51 31H14Z",cherry:"M40 36Q27 10 12 19 M40 36Q47 13 63 18 M25 38A15 15 0 1 0 25 68A15 15 0 1 0 25 38 M53 38A15 15 0 1 0 53 68A15 15 0 1 0 53 38",diamond:"M18 17H62L73 36L40 70L7 36Z M7 36H73 M18 17L29 36L40 70L51 36L62 17",bell:"M40 11Q20 12 20 39L13 53H67L60 39Q60 12 40 11Z M32 59Q40 73 48 59",star:"M40 7L50 30L75 32L56 49L62 74L40 60L18 74L24 49L5 32L30 30Z",bolt:"M45 6L17 43H37L31 75L65 32H44Z",emerald:"M19 15H61L73 35L40 70L7 35Z M7 35H73 M19 15L30 35L40 70L50 35L61 15",sapphire:"M40 7L70 30L58 65H22L10 30Z M10 30H70 M40 7L40 65",gold:"M14 28H66L59 62H21Z M21 21H59 M30 44H50",fire:"M42 7Q58 29 46 39Q67 34 61 55Q52 75 33 68Q11 58 22 35Q26 48 34 45Q26 27 42 7Z",egg:"M40 8C20 8 13 44 21 60Q40 81 59 60C67 44 60 8 40 8Z M27 46L39 34L50 46L40 57Z"};
const asset={};for(const [key,[light,dark]] of Object.entries(colors)){const d=paths[key];const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><defs><linearGradient id="g" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#fff8e6"/><stop stop-color="'+light+'"/><stop offset=".28" stop-color="'+dark+'"/><stop offset=".48" stop-color="'+light+'"/><stop offset=".58" stop-color="'+dark+'"/><stop offset=".75" stop-color="'+light+'"/><stop offset="1" stop-color="'+dark+'"/></linearGradient></defs><path d="'+d+'" transform="translate(0 3)" fill="#080512" stroke="#05020a" stroke-width="5"/><path d="'+d+'" fill="url(#g)" stroke="#fff3c7" stroke-width="2.2" stroke-linejoin="round"/><path d="'+d+'" fill="none" stroke="'+light+'" stroke-width="1" opacity=".8"/></svg>';asset[key]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function rnd(n){let a=new Uint32Array(1),m=4294967296,l=m-m%n;do{crypto.getRandomValues(a)}while(a[0]>=l);return a[0]%n}
let game="pharaoh",balance=5000,bet=50,busy=false,sound=true,ctx,board=[],history=[],progress={pharaoh:0,neon:0,dragon:0},round=0;
try{const s=JSON.parse(localStorage.getItem("arcana-v4"));if(s&&Number.isSafeInteger(s.balance)&&s.balance>=0){balance=s.balance;progress={...progress,...s.progress}}}catch{}
function save(){try{localStorage.setItem("arcana-v4",JSON.stringify({balance,progress}))}catch{}}
function beep(f=450,d=.09){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),v=ctx.createGain();o.type="triangle";o.frequency.value=f;v.gain.setValueAtTime(.05,ctx.currentTime);v.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(v).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch{}}
function newSymbol(){let c=G[game];return c.syms[rnd(c.syms.length)]}
function makeBoard(){let c=G[game];board=Array.from({length:c.w*c.h},newSymbol)}
function paint(classes={}){let c=G[game],root=$("board");root.className="board "+game;root.replaceChildren(...board.map((symbol,i)=>{let div=document.createElement("div");div.className="cell "+(classes[i]||"");let img=document.createElement("img");img.alt=symbol;img.src=asset[symbol];div.append(img);return div}))}
function status(s){$("result").textContent=s}
function update(){$("balance").textContent=fmt(balance);$("bet").textContent=fmt(bet);$("bonus").textContent="Bonus "+progress[game]+"/3";$("spin").disabled=busy||balance<bet;save()}
function render(){document.body.dataset.game=game;let c=G[game];$("title").textContent=c.title;$("desc").textContent=c.desc;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.game===game));$("rulesTitle").textContent="Reglas · "+c.title;$("rules").textContent=game==="pharaoh"?"5 rodillos × 3 filas. Se pagan combinaciones consecutivas desde la izquierda, en cualquiera de las tres filas. Tres iguales: ×2, cuatro: ×5, cinco: ×12 por línea.":game==="neon"?"Cascadas 6×5. Cada símbolo con 8 o más apariciones en la cuadrícula se elimina. Los símbolos restantes caen y se generan nuevos; cada cascada consecutiva aumenta el multiplicador.":"Grupos 7×7. Cinco o más gemas iguales conectadas horizontal o verticalmente se eliminan y provocan nuevas caídas. Grupos grandes pagan más.";makeBoard();paint();update()}
function mark(indices,cl){let obj={};indices.forEach(i=>obj[i]=cl);paint(obj)}
function spark(){const root=$("particles");for(let i=0;i<15;i++){let s=document.createElement("span");s.className="spark";s.textContent=["✦","✧","✺"][rnd(3)];s.style.left=(15+rnd(70))+"%";s.style.top=(20+rnd(60))+"%";s.style.color=["#ffe28b","#7cf9ff","#f49cff"][rnd(3)];s.style.setProperty("--dx",(rnd(200)-100)+"px");root.append(s);setTimeout(()=>s.remove(),950)}}
function pay(p){balance+=p;update();if(p){window.ArcanaFX?.event("win");window.ArcanaFX?.screenPulse();window.ArcanaFX?.burst($("board"),36);spark();[650,800,980].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*130))}}
function lineWin(){let c=G[game],wins=new Set(),total=0;for(let y=0;y<3;y++){let sym=board[y*c.w],n=1;while(n<c.w&&board[y*c.w+n]===sym)n++;if(n>=3){total+=bet*(n===5?12:n===4?5:2);for(let x=0;x<n;x++)wins.add(y*c.w+x)}}return {wins:[...wins],total}}
function neonWin(){let counts={};board.forEach((s,i)=>(counts[s]??=[]).push(i));let wins=[];for(let ids of Object.values(counts))if(ids.length>=8)wins.push(...ids);return [...new Set(wins)]}
function dragonWin(){let c=G.dragon,seen=new Set(),wins=[];for(let i=0;i<board.length;i++){if(seen.has(i))continue;let queue=[i],group=[];seen.add(i);for(let q=0;q<queue.length;q++){let at=queue[q];group.push(at);let x=at%c.w,y=Math.floor(at/c.w);for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=x+dx,ny=y+dy,j=ny*c.w+nx;if(nx>=0&&nx<c.w&&ny>=0&&ny<c.h&&!seen.has(j)&&board[j]===board[i]){seen.add(j);queue.push(j)}}}if(group.length>=5)wins.push(...group)}return wins}
async function cascade(wins){let c=G[game];mark(wins,"win");window.ArcanaFX?.event("clear");window.ArcanaFX?.burst($("board"),Math.min(50,wins.length*3));beep(880,.2);await sleep(450);mark(wins,"clear");await sleep(260);let removed=new Set(wins);for(let x=0;x<c.w;x++){let remain=[];for(let y=c.h-1;y>=0;y--){let i=y*c.w+x;if(!removed.has(i))remain.push(board[i])}for(let y=c.h-1;y>=0;y--){board[y*c.w+x]=remain[c.h-1-y]||newSymbol()}}paint(Object.fromEntries(wins.map(i=>[i,"fall"])));await sleep(390);window.ArcanaFX?.event("fall")}
function showBonus(){return new Promise(resolve=>{let o=$("bonusOverlay"),c=G[game];$("bonusTitle").textContent=game==="pharaoh"?"𓂀 CÁMARA DEL TESORO":game==="neon"?"⚡ SOBRECARGA NEÓN":"🐉 TESORO DEL DRAGÓN";$("bonusDesc").textContent="Elegí uno de los tres cofres. Cada uno contiene un premio virtual sorpresa.";$("bonusChoices").replaceChildren(...[0,1,2].map((_,i)=>{let b=document.createElement("button");b.textContent="🎁 Cofre "+(i+1);b.onclick=()=>{let prize=bet*(3+rnd(8));o.classList.add("hidden");resolve(prize)};return b}));o.classList.remove("hidden");window.ArcanaFX?.event("bonus")})}
async function spin(){if(busy||balance<bet)return;busy=true;round++;let c=G[game],stake=bet;balance-=stake;update();status("Girando…");window.ArcanaFX?.event("start");if(game==="pharaoh"){await window.ArcanaReels.spin({root:$("board"),columns:c.w,rows:c.h,symbols:c.syms,images:asset,random:rnd,settle:x=>{for(let y=0;y<c.h;y++)board[y*c.w+x]=newSymbol();paint();window.ArcanaFX?.event("stop")}});let r=lineWin();if(r.total){mark(r.wins,"win");status("✨ Combinación ganadora +"+fmt(r.total));await sleep(650);pay(r.total)}else status("Sin premio esta vez");paint()}
else{makeBoard();paint(Object.fromEntries(board.map((_,i)=>[i,"fall"])));await sleep(480);let chain=0,total=0;while(chain<8){let wins=game==="neon"?neonWin():dragonWin();if(!wins.length)break;chain++;let multiplier=Math.min(chain,5);let reward=stake*Math.max(1,Math.floor(wins.length/(game==="neon"?6:5)))*multiplier;total+=reward;status("✨ Cascada "+chain+" · ×"+multiplier+" · +"+fmt(reward));await cascade(wins)}if(total){pay(total);status("🎉 "+chain+" cascada(s) · +"+fmt(total)+" créditos")}else status("Sin combinaciones ganadoras")}
let bonusCount=board.filter(s=>s===c.bonus).length;if(game==="pharaoh")bonusCount=board.filter(s=>s===c.bonus).length;progress[game]+=Math.min(1,bonusCount>0?1:0);if(progress[game]>=3){progress[game]=0;update();let prize=await showBonus();pay(prize);status("🎁 Bonus especial: +"+fmt(prize)+" créditos")}
history.unshift(c.title+": saldo "+fmt(balance));$("history").replaceChildren(...history.slice(0,7).map(t=>{let li=document.createElement("li");li.textContent=t;return li}));busy=false;update();if(balance<bet)status("Saldo insuficiente: reducí la apuesta o reiniciá créditos")}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{if(busy)return;game=t.dataset.game;beep();window.ArcanaFX?.event("select");render();status("Elegí tu apuesta y girá")});

$("spin").onclick=spin;render();
</script></body></html>
